<!DOCTYPE html>
<html>
<head>
<title>Bus Ticket Booking</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background-color: lightblue;
}

form {
    background-color: white;
    width: 350px;
    margin: auto;
    padding: 20px;
}

input, select {
    width: 90%;
    padding: 8px;
    margin: 8px;
}

button {
    background-color: blue;
    color: white;
    padding: 10px;
    border: none;
}
</style>

</head>

<body>

<h1>Online Bus Ticket Booking</h1>

<form onsubmit="bookTicket(); return false;">

<input type="text" id="name" placeholder="Passenger Name" required>

<input type="text" id="from" placeholder="From" required>

<input type="text" id="to" placeholder="To" required>

<input type="date" id="date" required>

<select id="bus">
<option>Volvo</option>
<option>Sleeper Coach</option>
<option>AC Bus</option>
<option>Normal Bus</option>
</select>

<select id="seat">
<option>Seat 1</option>
<option>Seat 2</option>
<option>Seat 3</option>
<option>Seat 4</option>
<option>Seat 5</option>
</select>

<button type="submit">Book Ticket</button>

</form>

<h2 id="result"></h2>

<script>

function bookTicket() {

var name = document.getElementById("name").value;

var from = document.getElementById("from").value;

var to = document.getElementById("to").value;

var bus = document.getElementById("bus").value;

var seat = document.getElementById("seat").value;

document.getElementById("result").innerHTML =
"Ticket Booked Successfully! <br>" +
"Passenger: " + name + "<br>" +
"Route: " + from + " to " + to + "<br>" +
"Bus: " + bus + "<br>" +
"Seat: " + seat;

}

</script>

</body>
</html>
